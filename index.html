<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Meal Planner</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__title">
      <span class="app-header__emoji">🥗</span>
      <div>
        <h1>Weekly Meal Planner</h1>
        <p id="sourceLine" class="app-header__subtitle">Loading specials…</p>
      </div>
    </div>

    <div class="app-header__controls">
      <fieldset class="filter-group" id="categoryFilters">
        <legend>Meal type</legend>
        <label class="chip chip--v"><input type="checkbox" value="V" checked /> Vegetarian (V)</label>
        <label class="chip chip--nv"><input type="checkbox" value="NV" checked /> Non-Vegetarian (NV)</label>
        <label class="chip chip--vg"><input type="checkbox" value="VG" checked /> Vegan (VG)</label>
        <label class="chip chip--gf"><input type="checkbox" value="GF" /> Gluten-Free (GF)</label>
      </fieldset>

      <div id="headerTotal" class="header-total" hidden>
        Total: <strong id="headerTotalAmount">$0.00</strong>
      </div>

      <button id="backToStoresBtn" class="btn btn--primary btn--inline" type="button">
        🏬 Back To Stores
      </button>
    </div>
  </header>

  <main>
    <section id="cardGrid" class="card-grid" aria-label="Weekly meal plan cards"></section>
  </main>

  <button id="cartToggle" class="cart-fab" type="button" aria-label="Open shopping cart">
    🛒 <span id="cartCount" class="cart-fab__badge">0</span>
  </button>

  <aside id="cartPanel" class="cart-panel" aria-label="Shopping cart">
    <div class="cart-panel__header">
      <h2>Shopping Cart</h2>
      <button id="cartClose" class="icon-btn" type="button" aria-label="Close cart">✕</button>
    </div>
    <div id="cartEmpty" class="cart-empty">Select a meal card to add its ingredients here.</div>
    <div id="cartList" class="cart-list"></div>
    <div id="cartPantry" class="cart-pantry"></div>
    <div class="cart-panel__footer">
      <div class="cart-grand-total">
        <span>Grand total</span>
        <strong id="grandTotal">$0.00</strong>
      </div>
      <button id="pdfBtn" class="btn btn--primary" type="button" disabled>
        📄 Show Recipes (PDF)
      </button>
    </div>
  </aside>
  <div id="cartOverlay" class="cart-overlay"></div>

  <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <button id="modalClose" class="icon-btn modal__close" type="button" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="storePromptOverlay" class="modal-overlay store-prompt-overlay" role="dialog" aria-modal="true">
    <div class="modal store-prompt">
      <h2>Which store are you shopping at?</h2>
      <p>The meal plan and every price shown will be limited to that store's specials.</p>
      <div id="storePromptButtons" class="store-prompt__buttons"></div>
    </div>
  </div>

  <script src="supabase-client.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
